# Hermes' YAML config file, mounted into the pod at /data/config.yaml
# via a subPath mount on the hermes container. Hermes reads
# $HERMES_HOME/config.yaml at boot — HERMES_HOME=/data is set in the
# image, so /data/config.yaml is the path it picks up.
#
# Today this owns the model block used by API-server runs plus the
# mcp_servers block — six entries pointing at the mcp-auth-proxy sidecar
# on 127.0.0.1:9991..9996. The sidecar injects fresh bearer auth (default
# SA token for the K8s-SAR-gated MCPs; auth.romaine.life service JWT for
# github / tank-operator / glimmung) on every outbound call, so Hermes'
# MCP client config carries no secrets.
#
# Adding mcp_servers entries here requires:
#   1. A matching entry in mcp-auth-proxy's LISTENERS map (in
#      nelsong6/tank-operator/claude-container/mcp-auth-proxy/src/...)
#   2. A per-MCP RoleBinding admitting hermes/hermes (one PR per
#      MCP repo — see the rollout chain in
#      nelsong6/tank-operator#540).
#
# Hermes' Settings UI cannot edit this file: the subPath mount is
# read-only at the container. Chart / Helm is the source of truth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.yamlConfigMapName }}
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    # nelsong6/hermes — generated by the chart. Do not edit in-pod.
    model:
      provider: {{ .Values.config.model.provider | quote }}
      default: {{ .Values.config.model.default | quote }}
    mcp_servers:
{{- range $name, $cfg := .Values.mcpServers }}
      {{ $name }}:
        url: {{ $cfg.url | quote }}
{{- end }}
