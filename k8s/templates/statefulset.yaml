apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  serviceName: hermes
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      # Run as UID 1000 (image's `hermes` user) and set fsGroup so the
      # PVC at /data is chowned to that group on mount. Without fsGroup
      # the dynamically-provisioned PVC mounts as root:root and Hermes
      # crashes trying to mkdir /data/logs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        # ─── hermes (gateway + dashboard, single container) ──────────
        # Matches upstream's docker/entrypoint.sh layout: gateway is the
        # foreground process; the entrypoint backgrounds `hermes
        # dashboard` inside this container when HERMES_DASHBOARD=1.
        # Same PID namespace → dashboard's gateway-liveness check
        # (reads gateway.pid + flock'd gateway.lock under HERMES_HOME)
        # sees the gateway correctly. HERMES_DASHBOARD_TUI=1 enables
        # the embedded TUI Chat tab in the dashboard UI.
        #
        # Upstream docs explicitly warn against running these as
        # separate containers: "Running it as a separate container is
        # not supported: the dashboard's gateway-liveness detection
        # requires a shared PID namespace with the gateway process."
        # (website/docs/user-guide/docker.md)
        #
        # The dashboard binds 127.0.0.1:9119 by default (no auth);
        # the auth-proxy sidecar fronts it on 0.0.0.0:8080. Public
        # entry → auth-proxy → 127.0.0.1:9119.
        - name: hermes
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HERMES_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_TUI
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "127.0.0.1"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        # ─── auth-proxy sidecar ──────────────────────────────────────
        # Go reverse proxy that fronts the dashboard with
        # auth.romaine.life cookie delegation. Binds 0.0.0.0:8080 (the
        # public entrypoint via Service / HTTPRoute) and reverse-proxies
        # to 127.0.0.1:9119 (the dashboard, same pod's loopback). Per
        # request: forward inbound `.romaine.life` cookie to
        # /api/auth/get-session, cache 60s, allow iff role=admin OR
        # apps[<requiredAppKey>].access == true. Unauthed browser GETs
        # 302 to Entra via auth.romaine.life. See auth-proxy/ in this
        # repo.
        {{- if .Values.authProxy.enabled }}
        - name: auth-proxy
          image: {{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          ports:
            - name: auth-proxy
              containerPort: {{ .Values.authProxy.port }}
          env:
            - name: UPSTREAM_URL
              value: http://127.0.0.1:9119
            - name: PUBLIC_HOSTNAME
              value: {{ .Values.ingress.hostname | quote }}
            - name: REQUIRED_APP_KEY
              value: {{ .Values.authProxy.requiredAppKey | quote }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.authProxy.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: auth-proxy
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: auth-proxy
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
