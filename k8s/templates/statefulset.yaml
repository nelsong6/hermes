apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  serviceName: hermes
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      # Run as UID 1000 (image's `hermes` user) and set fsGroup so the
      # PVC at /data is chowned to that group on mount. Without fsGroup
      # the dynamically-provisioned PVC mounts as root:root and Hermes
      # crashes trying to mkdir /data/logs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: hermes
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # TODO: confirm Hermes' actual env var names against upstream
            # config interface. Names below are placeholders that align with
            # common patterns.
            - name: HERMES_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          # TODO: real readiness / liveness probes once we know Hermes' health
          # endpoint. Leaving commented so the pod can start without them
          # tripping during initial bring-up.
          # readinessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: http
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: http
          #   initialDelaySeconds: 30
          #   periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
