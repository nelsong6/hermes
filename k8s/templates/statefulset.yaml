apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  serviceName: hermes
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      # Run as UID 1000 (image's `hermes` user) and set fsGroup so the
      # PVC at /data is chowned to that group on mount. Without fsGroup
      # the dynamically-provisioned PVC mounts as root:root and Hermes
      # crashes trying to mkdir /data/logs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        # ─── gateway ─────────────────────────────────────────────────
        # Long-running messaging gateway. Does NOT bind any HTTP port —
        # it polls platform APIs outbound (Telegram/Slack/etc.) and
        # writes to the shared SQLite at /data. The dashboard sidecar
        # below is the web surface.
        - name: hermes
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HERMES_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        # ─── dashboard sidecar ───────────────────────────────────────
        # `hermes dashboard` — built-in web UI from the upstream `[web]`
        # extra (already in our `[all]` install). The dashboard has NO
        # auth and gives read-write access to config + .env (LLM key);
        # upstream refuses to bind to 0.0.0.0 without `--insecure` for
        # exactly that reason. We honor that and bind to 127.0.0.1
        # within the pod's network namespace. Reach it from a laptop with:
        #
        #     kubectl port-forward -n hermes pod/hermes-0 9119:9119
        #     open http://localhost:9119
        #
        # kubectl port-forward connects through the kubelet to the pod's
        # 127.0.0.1, so loopback-bound services are reachable that way.
        # A Service does NOT see this bind — exposing the dashboard to
        # the cluster needs an auth proxy in front (separate work).
        {{- if .Values.dashboard.enabled }}
        - name: dashboard
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tini", "--", "hermes", "dashboard", "--port", "9119"]
          env:
            - name: HERMES_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        # ─── auth-proxy sidecar ──────────────────────────────────────
        # Go reverse proxy that fronts the dashboard with
        # auth.romaine.life cookie delegation. Binds 0.0.0.0:8080 (the
        # public entrypoint via Service / HTTPRoute) and reverse-proxies
        # to 127.0.0.1:9119 (the dashboard, same pod's loopback). Per
        # request: forward inbound `.romaine.life` cookie to
        # /api/auth/get-session, cache 60s, allow iff role=admin OR
        # apps[<requiredAppKey>].access == true. Unauthed browser GETs
        # 302 to Entra via auth.romaine.life. See auth-proxy/ in this
        # repo.
        {{- if .Values.authProxy.enabled }}
        - name: auth-proxy
          image: {{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          ports:
            - name: auth-proxy
              containerPort: {{ .Values.authProxy.port }}
          env:
            - name: UPSTREAM_URL
              value: http://127.0.0.1:9119
            - name: PUBLIC_HOSTNAME
              value: {{ .Values.ingress.hostname | quote }}
            - name: REQUIRED_APP_KEY
              value: {{ .Values.authProxy.requiredAppKey | quote }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.authProxy.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: auth-proxy
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: auth-proxy
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
