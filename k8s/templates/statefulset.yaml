apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  serviceName: hermes
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      # Run as UID 1000 (image's `hermes` user) and set fsGroup so the
      # PVC at /data is chowned to that group on mount. Without fsGroup
      # the dynamically-provisioned PVC mounts as root:root and Hermes
      # crashes trying to mkdir /data/logs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        # ─── hermes (gateway + dashboard, single container) ──────────
        # Matches upstream's docker/entrypoint.sh layout: gateway is the
        # foreground process; the entrypoint backgrounds `hermes
        # dashboard` inside this container when HERMES_DASHBOARD=1.
        # Same PID namespace → dashboard's gateway-liveness check
        # (reads gateway.pid + flock'd gateway.lock under HERMES_HOME)
        # sees the gateway correctly. HERMES_DASHBOARD_TUI=1 enables
        # the embedded TUI Chat tab in the dashboard UI.
        #
        # Upstream docs explicitly warn against running these as
        # separate containers: "Running it as a separate container is
        # not supported: the dashboard's gateway-liveness detection
        # requires a shared PID namespace with the gateway process."
        # (website/docs/user-guide/docker.md)
        #
        # The dashboard binds 127.0.0.1:9119 by default (no auth);
        # the auth-proxy sidecar fronts it on 0.0.0.0:8080. Public
        # entry → auth-proxy → 127.0.0.1:9119.
        - name: hermes
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HERMES_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_TUI
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "127.0.0.1"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            {{- if .Values.apiServer.enabled }}
            # OpenAI-compatible API server. Bound to 0.0.0.0 so the
            # cluster-internal Service (templates/service-api.yaml) can
            # reach it; API_SERVER_KEY (Bearer token) is read from the
            # ExternalSecret-managed Secret via envFrom below. Tank's
            # backend drives this surface through /v1/runs — see
            # nelsong6/tank-operator#540.
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: {{ .Values.apiServer.host | quote }}
            - name: API_SERVER_PORT
              value: {{ .Values.apiServer.port | quote }}
            - name: API_SERVER_MODEL_NAME
              value: {{ .Values.apiServer.modelName | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          {{- if .Values.apiServer.enabled }}
          ports:
            - name: hermes-api
              containerPort: {{ .Values.apiServer.port }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            # Hermes' YAML config (mcp_servers map today) is
            # rendered into a sibling ConfigMap and projected onto
            # /data/config.yaml via subPath. subPath mount is
            # read-only at the container, so Hermes' Settings UI
            # cannot edit MCP servers in this deployment — chart /
            # Helm is the source of truth, which is what we want.
            - name: hermes-config-yaml
              mountPath: {{ .Values.config.dataDir }}/config.yaml
              subPath: config.yaml
              readOnly: true
        # ─── auth-proxy sidecar ──────────────────────────────────────
        # Go reverse proxy that fronts the dashboard with
        # auth.romaine.life cookie delegation. Binds 0.0.0.0:8080 (the
        # public entrypoint via Service / HTTPRoute) and reverse-proxies
        # to 127.0.0.1:9119 (the dashboard, same pod's loopback). Per
        # request: forward inbound `.romaine.life` cookie to
        # /api/auth/get-session, cache 60s, allow iff role=admin OR
        # apps[<requiredAppKey>].access == true. Unauthed browser GETs
        # 302 to Entra via auth.romaine.life. See auth-proxy/ in this
        # repo.
        {{- if .Values.authProxy.enabled }}
        - name: auth-proxy
          image: {{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          ports:
            - name: auth-proxy
              containerPort: {{ .Values.authProxy.port }}
          env:
            - name: UPSTREAM_URL
              value: http://127.0.0.1:9119
            - name: PUBLIC_HOSTNAME
              value: {{ .Values.ingress.hostname | quote }}
            - name: REQUIRED_APP_KEY
              value: {{ .Values.authProxy.requiredAppKey | quote }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.authProxy.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: auth-proxy
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: auth-proxy
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
        {{- end }}
        # ─── mcp-auth-proxy sidecar ──────────────────────────────────
        # Localhost reverse proxy that injects fresh bearer auth on
        # outbound MCP calls. Same image (and same per-port behavior)
        # Tank session pods carry today — carved out into a standalone
        # publishable image in nelsong6/tank-operator#541 so non-Tank
        # pods can sidecar it without pulling a full session container.
        #
        # Listens on 127.0.0.1:9991..9996 inside the pod (the MCP
        # listeners), plus 0.0.0.0:{{ .Values.mcpAuthProxy.metricsPort }}
        # for Prometheus /metrics + /healthz. Per upstream, the
        # 127.0.0.1 listeners deliberately stay off the network — only
        # the hermes container in the same pod's net namespace reaches
        # them. Hermes' config.yaml has six `mcp_servers` entries
        # pointed at those localhost ports (see
        # templates/configmap-config-yaml.yaml).
        #
        # Auth shape per MCP server:
        # - K8s SAR-gated (azure-personal, k8s, argocd, glimmung,
        #   tank-operator): proxy attaches the default SA token from
        #   /var/run/secrets/kubernetes.io/serviceaccount/token
        #   (auto-mounted by kubelet) to outbound Authorization.
        #   Each MCP server's chart admits Hermes' SA via its
        #   per-MCP RoleBinding — separate one-line PRs per MCP repo
        #   (see nelsong6/tank-operator#540's rollout chain).
        # - auth.romaine.life-JWT-gated (github application-layer;
        #   X-Auth-Romaine-Token side header for tank-operator /
        #   glimmung): proxy exchanges the audience-pinned projected
        #   SA token (mounted at /var/run/secrets/auth.romaine.life)
        #   for a role=service JWT via auth.romaine.life's
        #   /api/auth/exchange/k8s. Hermes is onboarded as a
        #   pod-stable consumer in nelsong6/auth#41.
        {{- if .Values.mcpAuthProxy.enabled }}
        - name: mcp-auth-proxy
          image: {{ .Values.mcpAuthProxy.image.repository }}:{{ .Values.mcpAuthProxy.image.tag }}
          imagePullPolicy: {{ .Values.mcpAuthProxy.image.pullPolicy }}
          env:
            - name: MCP_AUTH_PROXY_METRICS_PORT
              value: {{ .Values.mcpAuthProxy.metricsPort | quote }}
            # SESSION_ID intentionally unset: Hermes has no per-pod
            # session identity (singleton serving many users). The
            # proxy will omit X-Tank-Origin-Session-Id and
            # mcp-tank-operator's user-bubble avatar code path will
            # fall back to the human-Gravatar rendering. Per-request
            # session attribution forward through the MCP layer is
            # the same out-of-scope future enhancement called out on
            # the other pod-stable consumers (see
            # nelsong6/auth/src/service-exchange.ts's pod-stable
            # comment).
          ports:
            - name: metrics
              containerPort: {{ .Values.mcpAuthProxy.metricsPort }}
          volumeMounts:
            - name: auth-romaine-sa-token
              mountPath: /var/run/secrets/auth.romaine.life
              readOnly: true
          resources:
            {{- toYaml .Values.mcpAuthProxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: hermes-config-yaml
          configMap:
            name: {{ .Values.config.yamlConfigMapName }}
        # Projected SA token audience-pinned to auth.romaine.life.
        # The mcp-auth-proxy sidecar POSTs this token to
        # auth.romaine.life/api/auth/exchange/k8s and receives a
        # role=service JWT it then injects into outbound calls to
        # romaine-JWT-gated MCP servers (mcp-github application-layer
        # auth; X-Auth-Romaine-Token side header for mcp-tank-operator /
        # mcp-glimmung). Distinct audience and distinct file path from
        # the default SA token (auto-mounted by kubelet at the
        # well-known path) so a stolen token cannot be replayed
        # across services. Same shape Tank session pods use.
        - name: auth-romaine-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "https://auth.romaine.life"
                  expirationSeconds: 3600
                  path: token
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
