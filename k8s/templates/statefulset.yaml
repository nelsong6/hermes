apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  serviceName: hermes
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      # Run as UID 1000 (image's `hermes` user) and set fsGroup so the
      # PVC at /data is chowned to that group on mount. Without fsGroup
      # the dynamically-provisioned PVC mounts as root:root and Hermes
      # crashes trying to mkdir /data/logs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        # ─── gateway ─────────────────────────────────────────────────
        # Long-running messaging gateway. Does NOT bind any HTTP port —
        # it polls platform APIs outbound (Telegram/Slack/etc.) and
        # writes to the shared SQLite at /data. The dashboard sidecar
        # below is the web surface.
        - name: hermes
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HERMES_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        # ─── dashboard sidecar ───────────────────────────────────────
        # `hermes dashboard` — built-in web UI from the upstream `[web]`
        # extra (FastAPI + uvicorn, already included in `[all]`). Binds
        # 0.0.0.0:9119 so port-forward and the Service can reach it.
        # NO AUTH at the app level — the gate is k8s RBAC for
        # `kubectl port-forward`. Do NOT add a public ingress without
        # putting an auth proxy in front; the dashboard gives read-write
        # access to config and .env (LLM key).
        {{- if .Values.dashboard.enabled }}
        - name: dashboard
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tini", "--", "hermes", "dashboard", "--host", "0.0.0.0", "--port", "9119"]
          ports:
            - name: dashboard
              containerPort: 9119
          env:
            - name: HERMES_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
            - secretRef:
                name: {{ .Values.externalSecret.secretName }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
