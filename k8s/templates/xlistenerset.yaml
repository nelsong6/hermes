{{- if .Values.ingress.enabled -}}
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XListenerSet
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.ingress.gatewayName }}
    namespace: {{ .Values.ingress.gatewayNamespace }}
  listeners:
    # Named `hermes-https` (not just `https`) so a ClientTrafficPolicy can
    # target this exact listener via sectionName — Envoy Gateway's section-
    # name match on a parent Gateway lands on the first XListenerSet-
    # contributed listener with the matching name, so a unique name is the
    # only way to address us specifically. See clienttrafficpolicy.yaml.
    - name: hermes-https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.ingress.tlsSecret }}
{{- end }}
