{{- if .Values.service.enabled -}}
# Front door is the auth-proxy on port 8080. Browser hits this Service via
# the HTTPRoute and the proxy gates each request before forwarding to the
# dashboard at 127.0.0.1:9119 (loopback inside the same pod). The dashboard
# itself is never exposed by a Service.
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: hermes
  ports:
    - name: http
      port: 80
      targetPort: auth-proxy
{{- end }}
