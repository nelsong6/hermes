{{- if .Values.service.enabled -}}
# Service is OFF by default — the dashboard binds to 127.0.0.1 inside the
# pod so a Service can't reach it. When we put an auth proxy in front and
# bind the dashboard to a non-loopback address, flip `service.enabled` on
# and add the appropriate port mapping here.
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: hermes
  ports: []
{{- end }}
