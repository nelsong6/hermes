apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: hermes
  ports:
    # Hermes dashboard — cluster-internal only. No auth; reach via
    # `kubectl port-forward svc/hermes 9119:9119` and browse to
    # http://localhost:9119. See CLAUDE.md for caveats on exposing
    # publicly (needs an auth proxy in front).
    - name: dashboard
      port: 9119
      targetPort: dashboard
