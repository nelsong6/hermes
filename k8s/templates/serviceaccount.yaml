apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Wired in tofu/identity.tf. Federated subject:
    # system:serviceaccount:hermes:hermes → hermes-identity.
    azure.workload.identity/client-id: {{ .Values.serviceAccountClientId | quote }}
  labels:
    azure.workload.identity/use: "true"
