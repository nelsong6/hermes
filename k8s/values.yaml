image:
  repository: romainecr.azurecr.io/hermes
  # SHA-pinned. `build.yaml` rewrites this line on every push to main via a
  # `[skip ci]` follow-up commit. Quote the value so all-digit short SHAs
  # aren't reformatted as scientific notation by YAML.
  tag: "app-37005d8c22ab7ff653268f1771ed4789e1690b1f"
  pullPolicy: IfNotPresent

namespace: hermes
serviceAccount: hermes
# Dedicated Hermes app identity from tofu/identity.tf's
# `hermes_dedicated_identity_client_id` output (UAMI `hermes-identity`
# in resource group `hermes`).
serviceAccountClientId: "137a3b5e-4da9-4fea-8396-42a2744f9965"

# Single replica is intentional — Hermes' value lives in the SQLite WAL +
# skills directory on the PVC. Multi-replica needs an external memory backend
# upstream doesn't provide today.
replicas: 1

# Persistence for SQLite (FTS5 cross-session recall + LLM summarization),
# skills directory, and Honcho user-modeling state. 5Gi is comfortable for
# ~10 active users; raise if usage grows.
persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""        # falls back to cluster default
  accessMode: ReadWriteOnce
  mountPath: /data

# Container resource requests / limits. Tune after observing real usage.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Public ingress is DISABLED. The `hermes gateway` process (our main
# container) does not bind an HTTP port — it only polls platform APIs
# outbound. The `hermes dashboard` sidecar (see below) IS an HTTP server,
# but it ships with no authentication and gives read-write access to
# config + .env (LLM API key). Exposing it at hermes.romaine.life requires
# an auth proxy in front (e.g. mcp-auth or oauth2-proxy) — separate work.
# Reach the dashboard via `kubectl port-forward svc/hermes 9119:9119`.
ingress:
  enabled: false
  hostname: hermes.romaine.life
  gatewayName: main
  gatewayNamespace: envoy-gateway-system
  certIssuer: letsencrypt-prod
  tlsSecret: hermes-tls

# Dashboard sidecar — `hermes dashboard` from upstream's `[web]` extra
# (included in `[all]`, already in the image). Runs alongside the gateway
# against the same /data volume, so it sees the same sessions / skills /
# config / .env.
dashboard:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ExternalSecret — Hermes' upstream config keys (LLM API key, optional
# platform bot tokens). Each entry maps a Key Vault secret to an env var
# the StatefulSet envFroms.
#
# TODO: confirm the exact env var names Hermes reads. Placeholders below
# follow common patterns; real upstream names go here once verified.
# All KV secrets must be created manually before turning on the relevant
# platform — they are not provisioned by tofu.
externalSecret:
  storeName: romaine-kv
  storeKind: ClusterSecretStore
  refreshInterval: 1h
  secretName: hermes-secrets
  keys:
    - envVar: OPENROUTER_API_KEY      # or OPENAI_API_KEY / NOUS_PORTAL_API_KEY
      kvKey: hermes-llm-api-key
    # Per-platform bot tokens — enable as platforms are turned on.
    # - envVar: TELEGRAM_BOT_TOKEN
    #   kvKey: hermes-telegram-bot-token
    # - envVar: SLACK_BOT_TOKEN
    #   kvKey: hermes-slack-bot-token

# Non-secret config. Confirm against Hermes' actual config interface.
config:
  name: hermes-config
  # Where Hermes writes its SQLite + skills. Must match persistence.mountPath.
  dataDir: /data
