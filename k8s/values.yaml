image:
  repository: romainecr.azurecr.io/hermes
  # SHA-pinned. `build.yaml` rewrites this line on every push to main via a
  # `[skip ci]` follow-up commit. Quote the value so all-digit short SHAs
  # aren't reformatted as scientific notation by YAML.
  tag: "app-a0c33d9b5ab152e5cd2ce838f7d2a6299b76b912"
  pullPolicy: IfNotPresent

namespace: hermes
serviceAccount: hermes
# Dedicated Hermes app identity from tofu/identity.tf's
# `hermes_dedicated_identity_client_id` output (UAMI `hermes-identity`
# in resource group `hermes`).
serviceAccountClientId: "137a3b5e-4da9-4fea-8396-42a2744f9965"

# Single replica is intentional — Hermes' value lives in the SQLite WAL +
# skills directory on the PVC. Multi-replica needs an external memory backend
# upstream doesn't provide today.
replicas: 1

# Persistence for SQLite (FTS5 cross-session recall + LLM summarization),
# skills directory, and Honcho user-modeling state. 5Gi is comfortable for
# ~10 active users; raise if usage grows.
persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""        # falls back to cluster default
  accessMode: ReadWriteOnce
  mountPath: /data

# Container resource requests / limits. Single container now runs both
# gateway (foreground) and dashboard (backgrounded by entrypoint), so
# headroom covers both processes. Tune after observing real usage.
resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 1536Mi

# Public ingress at hermes.romaine.life. Traffic terminates at the
# auth-proxy sidecar (port 8080), which gates every request via
# auth.romaine.life cookie delegation before forwarding to the dashboard
# at 127.0.0.1:9119. Pattern: XListenerSet + cert-manager + HTTPRoute,
# mirrors glimmung.
ingress:
  enabled: true
  hostname: hermes.romaine.life
  gatewayName: main
  gatewayNamespace: envoy-gateway-system
  certIssuer: letsencrypt-prod
  tlsSecret: hermes-tls

# The dashboard process is no longer a separate container — it runs
# inside the `hermes` container, backgrounded by our entrypoint script
# when HERMES_DASHBOARD=1 (matching upstream's docker/entrypoint.sh).
# That env var + HERMES_DASHBOARD_TUI=1 (to enable the Chat tab) are
# set in templates/statefulset.yaml. No values here to tweak unless
# we later carve dashboard knobs back out.

# Auth-proxy sidecar — Go reverse proxy that fronts the dashboard with
# auth.romaine.life cookie delegation. Per-request: forward inbound
# cookie to /api/auth/get-session, cache 60s, allow iff role=admin OR
# apps.hermes.access=true. Unauthed browser GETs 302 to Entra via
# auth.romaine.life. Lifted from glimmung's internal/auth/cookie_delegate.go.
authProxy:
  enabled: true
  image:
    repository: romainecr.azurecr.io/auth-proxy
    # Rewritten by build.yaml on first push to main. Until then this
    # placeholder makes the chart syntactically valid; the pod will
    # ImagePullBackOff until the real tag is committed — visible signal,
    # no infinite reconcile churn.
    tag: "app-a0c33d9b5ab152e5cd2ce838f7d2a6299b76b912"
    pullPolicy: IfNotPresent
  port: 8080
  # Key in the auth.romaine.life user's `apps` JSON column to check for
  # `.access: true`. Admins bypass this (role=admin → allow regardless).
  requiredAppKey: hermes
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Service is enabled — front door is the auth-proxy on port 8080. The
# dashboard's 127.0.0.1:9119 is reached only by the auth-proxy in the same
# pod's net namespace; never directly.
service:
  enabled: true

# ExternalSecret — Hermes' upstream config keys (LLM API key, optional
# platform bot tokens). Each entry maps a Key Vault secret to an env var
# the StatefulSet envFroms.
#
# TODO: confirm the exact env var names Hermes reads. Placeholders below
# follow common patterns; real upstream names go here once verified.
# All KV secrets must be created manually before turning on the relevant
# platform — they are not provisioned by tofu.
externalSecret:
  storeName: romaine-kv
  storeKind: ClusterSecretStore
  refreshInterval: 1h
  secretName: hermes-secrets
  keys:
    - envVar: OPENROUTER_API_KEY      # or OPENAI_API_KEY / NOUS_PORTAL_API_KEY
      kvKey: hermes-llm-api-key
    # Bearer token for the OpenAI-compatible API server (port 8642).
    # Tank's backend reads the same KV secret on its side and uses it
    # to authenticate /v1/runs calls — see nelsong6/tank-operator#540.
    - envVar: API_SERVER_KEY
      kvKey: hermes-api-bearer
    # Per-platform bot tokens — enable as platforms are turned on.
    # - envVar: TELEGRAM_BOT_TOKEN
    #   kvKey: hermes-telegram-bot-token
    # - envVar: SLACK_BOT_TOKEN
    #   kvKey: hermes-slack-bot-token

# Non-secret config. Confirm against Hermes' actual config interface.
config:
  name: hermes-config
  # Where Hermes writes its SQLite + skills. Must match persistence.mountPath.
  dataDir: /data
  # YAML config file Hermes reads at boot for non-secret settings
  # (notably the `mcp_servers` map). Mounted into the hermes container
  # at /data/config.yaml via a subPath mount from a sibling ConfigMap;
  # see templates/configmap-config-yaml.yaml. The file is read-only at
  # the mount point — Hermes' Settings UI cannot edit MCP servers in
  # this deployment; chart / Helm is the source of truth.
  yamlConfigMapName: hermes-config-yaml

# OpenAI-compatible API server (POST /v1/chat/completions, /v1/responses,
# /v1/runs, …). Tank's backend drives Hermes through /v1/runs in
# nelsong6/tank-operator#540's `hermes_gui` session mode. Bound to
# 0.0.0.0 so it's reachable on the cluster-internal Service (see
# templates/service-api.yaml). Public HTTPRoute is NOT extended — the
# API server stays off the public ingress; only the auth-proxy-fronted
# dashboard is publicly reachable.
apiServer:
  enabled: true
  port: 8642
  host: "0.0.0.0"
  # Model name advertised on GET /v1/models. Tank ignores the model
  # field per the Hermes API doc ("Model field is cosmetic"), but a
  # human-readable label is useful in the dashboard's session list.
  modelName: "hermes-agent"

# mcp-auth-proxy sidecar. Same image Tank session pods bake inline;
# carved out as a standalone image in nelsong6/tank-operator#541.
# Listens on 127.0.0.1:9991..9996 inside the pod and injects fresh
# bearer auth (default SA token for the K8s-SAR-gated MCPs; auth.romaine.life
# service JWT for the romaine-JWT-gated ones) on every outbound call.
# Metrics on 0.0.0.0:9990, scraped by the kube-prometheus-stack
# PodMonitor in this chart (k8s/templates/podmonitor.yaml — added when
# observability arrives).
mcpAuthProxy:
  enabled: true
  image:
    repository: romainecr.azurecr.io/mcp-auth-proxy
    # Bumped by build.yaml on push-to-main once nelsong6/tank-operator
    # publishes the standalone image. Placeholder until then — pod will
    # ImagePullBackOff with a visible signal, no reconcile churn. Same
    # posture as the original auth-proxy tag placeholder.
    tag: "mcp-auth-proxy-placeholder"
    pullPolicy: IfNotPresent
  metricsPort: 9990
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 192Mi

# Tank's in-cluster MCP servers Hermes is wired to call. Mirror exactly
# the LISTENERS table in mcp-auth-proxy's server.py — the proxy already
# carries the upstream service DNS for each port, so this block is just
# the local-port → MCP-name map Hermes' config.yaml gets seeded with.
# Adding/removing entries here requires a matching change to mcp-auth-proxy.
mcpServers:
  azure-personal:
    url: "http://127.0.0.1:9991"
  github:
    url: "http://127.0.0.1:9992"
  k8s:
    url: "http://127.0.0.1:9993"
  argocd:
    url: "http://127.0.0.1:9994"
  glimmung:
    url: "http://127.0.0.1:9995"
  tank-operator:
    url: "http://127.0.0.1:9996"
